<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Image Slider</title>
  </head>
  <body>
    <div class="slider-container">
      <button class="prev-btn">Previous</button>
      <div class="slider">
        <div class="image-id">Image 1</div>
        <img class="active" src="./imgs/01.jpg" alt="img-1" />
        <img src="./imgs/02.jpg" alt="img-2" />
        <img src="./imgs/03.jpg" alt="img-3" />
        <img src="./imgs/04.jpg" alt="img-4" />
        <img src="./imgs/05.jpg" alt="img-5" />
        <img src="./imgs/06.jpg" alt="img-6" />
        <img src="./imgs/07.jpg" alt="img-7" />
        <img src="./imgs/08.jpg" alt="img-8" />
      </div>
      <button class="next-btn">Next</button>
    </div>
    <div class="gallery-container"></div>
    <script src="main.js"></script>
  </body>
</html>
